name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"   # every day at about 06:17 UTC
  workflow_dispatch: {}     # adds a "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the SVG files
        run: python build_profile.py
        env:
          GH_USER: ${{ github.repository_owner }}
      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg info-card.svg data/contributions.json
          git diff --cached --quiet || git commit -m "chore: refresh profile art [skip ci]"
          git push
